# Sito pubblico di ClaudeTrade su claudetrade.eu (VM Oracle, 2026-09-06).
# I blocchi HTTPS e il redirect da http li aggiunge certbot: dopo un rinnovo
# della configurazione ricopiare qui il file vivo da /etc/nginx/sites-available.
# File statico rigenerato da jobs/claudetrade_page.py; nginx non fa altro che
# consegnarlo. Niente elenco delle cartelle, niente metodi oltre GET/HEAD.
server {
    server_name claudetrade.eu www.claudetrade.eu;

    root /var/www/claudetrade;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    # la pagina si riscrive ogni mezz'ora: non deve restare in cache piu' a lungo
    location = / {
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/claudetrade.access.log;
    error_log  /var/log/nginx/claudetrade.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/claudetrade.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/claudetrade.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.claudetrade.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = claudetrade.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name claudetrade.eu www.claudetrade.eu;
    return 404; # managed by Certbot




}