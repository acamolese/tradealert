name: Telegram Commands Listener

on:
  schedule:
    # Ogni 30 min, TUTTI i giorni 06-21 UTC. Latenza max ~30 min sul comando
    # /posizioni, accettabile per swing. Limite scelto per stare dentro il
    # free tier GitHub Actions (2000 min/mese su repo privato).
    - cron: "*/30 6-21 * * *"
  workflow_dispatch:

concurrency:
  # Mai due listener insieme: si ruberebbero gli updates a vicenda.
  group: telegram-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Listen for commands
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_ENV: ${{ vars.CAPITAL_ENV || 'demo' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARGIN_BUDGET_EUR: ${{ vars.MARGIN_BUDGET_EUR || '15' }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS || '1' }}
          MIN_SCORE_THRESHOLD: ${{ vars.MIN_SCORE_THRESHOLD || '7' }}
          EXECUTION_MODE: ${{ vars.EXECUTION_MODE || 'coach' }}
          CONFIRM_TIMEOUT_SEC: ${{ vars.CONFIRM_TIMEOUT_SEC || '240' }}
          LISTEN_SECONDS: "60"
        run: python -m jobs.listen
